<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
  </defs>
  <!-- Black background rounded square with black border -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="url(#bg)" stroke="#000" stroke-width="2"/>
  <!-- Red accent layer behind (mimics the header's red offset) -->
  <rect x="4" y="4" width="24" height="24" rx="4" fill="#dc2626" opacity="0.1"/>
  <!-- DC text in yellow/gold like header -->
  <text x="16" y="22" font-family="Arial Black, Helvetica Bold, sans-serif" font-size="14" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="-0.3">DC</text>
</svg>